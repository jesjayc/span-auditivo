<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Span de Dígitos Auditivo</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <main id="app">
    
    <!-- Name Screen -->
    <section id="screen-name" class="screen">
      <div class="card">
        <h1 class="title" style="margin-bottom: 0;">Bem-vindo(a) ao Experimento</h1>
        <h2 class="title" style="color: var(--text); font-size: 1.8rem; margin-top: 10px;">Span Auditivo</h2>
        <p style="margin-bottom: 2rem; font-size: 1.1rem; color: var(--text-dim);">Para começar, por favor, digite seu ID ou nome.</p>
        
        <input type="text" id="participant-name-input" class="input-name" placeholder="Digite seu nome ou ID..." autocomplete="off">
        
        <div style="display: flex; justify-content: center; width: 100%;">
            <button id="btn-submit-name" class="btn-main">AVANÇAR PARA TESTE DE ÁUDIO</button>
        </div>
      </div>
    </section>

    <!-- Audio Test Screen -->
    <section id="screen-audio-test" class="screen" hidden>
      <div class="card">
        <h2 class="title" style="font-size: 2.2rem;">Teste de Áudio</h2>
        <div class="instructions-text">
            <p style="margin-bottom: 20px; font-size: 1.1rem;">Clique no botão para ouvir e digite os <strong>3 números</strong> ditos abaixo:</p>
        </div>
        <div id="audio-test-content">
          
          <button id="btn-play-audio" class="btn-action" style="margin: 0 auto 15px auto;">
            <span id="play-audio-text">▶ REPRODUZIR ÁUDIO</span>
          </button>
          
          <div id="audio-test-input-display" class="input-display" style="margin-top: 15px;"></div>
          
          <button id="btn-check-audio" class="btn-secondary" style="text-transform: uppercase; font-weight: bold; letter-spacing: 1px;" disabled>Verificar</button>
        </div>
        
        <p id="audio-test-feedback" class="feedback"></p>
        
        <div style="margin-top: 25px; width: 100%;">
            <button id="btn-start-test" class="btn-main" hidden>TUDO CERTO! VER INSTRUÇÕES (ESPAÇO)</button>
        </div>
        
        <button id="btn-reload-page" class="btn-secondary" hidden>Voltar ao Início</button>
      </div>
    </section>

    <!-- Instructions Screen -->
    <section id="screen-instructions" class="screen" hidden>
      <div class="card">
        <h2 id="instruction-title" class="title"></h2>
        <div id="instruction-content" class="instructions-text"></div>
        <button id="btn-ready" class="btn-main">ESTOU PRONTO (ESPAÇO)</button>
      </div>
    </section>

    <!-- Test Screen -->
    <section id="screen-test" class="screen" hidden>
        <div class="card">
            <div id="test-preparing" class="animate-pulse">
                <h2 class="title" style="font-size: 3rem;">Prepare-se!</h2>
            </div>
            
            <div id="test-playing" hidden>
              <div class="speaker-emoji animate-pulse">🔊</div>
            </div>
            
            <div id="test-inputting" hidden>
              <div class="last-typed-display">
                  <span id="last-typed-digit"></span>
              </div>
              <div class="button-group">
                  <button id="btn-redo" class="btn-secondary">Refazer</button>
                  <button id="btn-next" class="btn-primary">Próximo</button>
              </div>
            </div>
        </div>
    </section>

    <!-- Results Screen -->
    <section id="screen-results" class="screen" hidden>
      <div class="card">
          <h1 class="title" style="font-size: 2.25rem;">Você finalizou o teste!</h1>
          <p id="email-status-text" style="margin-bottom: 2.5rem; font-weight: 600; color: var(--text-dim); font-size: 1.1rem;">⏳ Processando resultados...</p>
          
          <div style="display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; margin: 0 auto;">
              <button id="btn-copy-bkp" class="btn-secondary" style="margin: 0; width: 100%;">COPIAR DADOS BRUTOS (BKP)</button>
              <button id="btn-exit" class="btn-secondary" style="margin: 0; width: 100%; background: var(--border);">SAIR</button>
          </div>
      </div>
    </section>

  </main>
  <script src="src/js/script.js"></script>
</body>
</html>
